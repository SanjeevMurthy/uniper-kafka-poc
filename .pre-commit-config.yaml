# Run with: pre-commit install && pre-commit run --all-files
# CI runs the same checks via .github/workflows/tflint.yml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
        exclude: ^terraform/modules/  # validated separately in CI per-module
      - id: terraform_tflint
        args:
          - --args=--recursive
      - id: terraform_trivy
        args:
          - --args=--severity HIGH,CRITICAL
          - --args=--exit-code 0   # non-blocking initially

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint
